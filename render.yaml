databases:
  - name: clinic-db
    plan: free
    databaseName: clinic
    user: clinic

services:
  - type: web
    name: clinic-appointment-system
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
