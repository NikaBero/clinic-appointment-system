  // თემის ადრეული გამოყენება — რომ არ იყოს light->dark ციმციმი გვერდის ჩატვირთვისას

    var saved = localStorage.getItem('mc_theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

  })();

<body class="bg-paper text-ink">

<div id="toast" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>
<div id="app" class="min-h-screen"></div>

<script>
/* =========================================================================
   MediCare — Clinic Appointment System
   Vanilla JS single-page frontend (no build step required).
   Talks to the FastAPI backend served from the same origin.
   ========================================================================= */

const API_BASE = ''; // same origin as backend

const state = {
  token: localStorage.getItem('mc_token') || null,
  role: localStorage.getItem('mc_role') || null,
  fullName: localStorage.getItem('mc_full_name') || null,
  userId: localStorage.getItem('mc_user_id') || null,
  view: 'home',
  patientTab: 'book',
  doctorTab: 'appointments',
  adminTab: 'analytics',
  bookingFlow: { specialty: null, doctors: [], selectedDoctor: null, day: null, slots: [] },
  aiResult: null,
  notifications: [],
  notifPanelOpen: false,
  resetToken: null,
  calendarWeekOffset: 0,
  adminUserSearch: '',
  adminUserRole: '',
};

function saveSession(data) {
  state.token = data.access_token;
  state.role = data.role;
  state.fullName = data.full_name;
  state.userId = data.user_id;
  localStorage.setItem('mc_token', data.access_token);
  localStorage.setItem('mc_role', data.role);
  localStorage.setItem('mc_full_name', data.full_name);
  localStorage.setItem('mc_user_id', data.user_id);
}

function logout() {
  state.token = null; state.role = null; state.fullName = null; state.userId = null;
  localStorage.clear();
  state.view = 'home';
  route();
}

function toast(msg, kind) {
  const el = document.createElement('div');
  const colors = kind === 'error' ? 'bg-danger' : (kind === 'success' ? 'bg-success' : 'bg-ink');
  el.className = `${colors} text-white px-4 py-3 rounded-lg shadow-lg text-sm fade-in max-w-xs`;
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

async function api(path, method = 'GET', body = null, auth = true) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API_BASE + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* no json body */ }
  if (res.status === 401 && auth && state.token) {
    // ტოკენი ვადაგასულია/არასწორია — სესია სუფთად ვასუფთავებთ და login-ზე ვაბრუნებთ
    state.token = null; state.role = null; state.fullName = null; state.userId = null;
    localStorage.clear();
    toast('სესიის ვადა ამოიწურა, გთხოვთ ხელახლა შეხვიდეთ', 'error');
    state.view = 'login';
    route();
    throw new Error('სესია ამოიწურა');
  }
  if (!res.ok) {
    const detail = (data && data.detail) ? data.detail : 'დაფიქსირდა შეცდომა';
    throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
  }
  return data;
}

async function downloadPrescription(appointmentId) {
  try {
    const res = await fetch(`${API_BASE}/appointments/${appointmentId}/prescription/pdf`, {
      headers: { 'Authorization': 'Bearer ' + state.token },
    });
    if (!res.ok) throw new Error('რეცეპტის ჩამოტვირთვა ვერ მოხერხდა');
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `prescription_${appointmentId}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    window.URL.revokeObjectURL(url);
  } catch (e) { toast(e.message, 'error'); }
}

/* ------------------------------ Notifications --------------------------- */

async function loadNotifications() {
  if (!state.token) return;
  try {
    state.notifications = await api('/notifications/me');
  } catch (e) { /* silent */ }
}

function notifTypeIcon(type) {
  return {
    appointment_confirmed: 'calendar-check',
    appointment_cancelled: 'calendar-x',
    prescription_added: 'file-text',
    review_added: 'star',
    reminder: 'alarm-clock',
  }[type] || 'bell';
}

function toggleNotifPanel() {
  state.notifPanelOpen = !state.notifPanelOpen;
  renderNotifPanel();
}

function renderNotifPanel() {
  const panel = document.getElementById('notif-panel');
  if (!panel) return;
  if (!state.notifPanelOpen) { panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  const unread = state.notifications.filter(n => !n.is_read).length;
  panel.innerHTML = `
    <div class="flex items-center justify-between px-4 py-3 border-b border-border">
      <span class="font-semibold text-sm">შეტყობინებები</span>
      ${unread ? `<button class="text-xs text-primary font-medium" onclick="markAllNotificationsRead()">ყველას წაკითხვა</button>` : ''}
    </div>
    <div class="max-h-80 overflow-y-auto">
      ${state.notifications.length ? state.notifications.map(n => `
        <div class="px-4 py-3 border-b border-border last:border-0 flex gap-2 items-start ${n.is_read ? '' : 'bg-primary/5'} cursor-pointer" onclick="markNotificationRead(${n.id})">
          <span class="mt-0.5" style="color:${n.is_read ? '#6B7A78' : '#0F766E'}">${icon(notifTypeIcon(n.type), 'w-4 h-4')}</span>
          <div class="flex-1 min-w-0">
            <p class="text-xs ${n.is_read ? 'text-muted' : 'text-ink font-medium'}">${escapeHtml(n.message)}</p>
            <p class="text-[10px] text-muted mt-1">${new Date(n.created_at).toLocaleString('ka-GE', {dateStyle:'medium', timeStyle:'short'})}</p>
          </div>
        </div>`).join('') : `<div class="px-4 py-6 text-center text-muted text-sm">შეტყობინებები ჯერ არ არის.</div>`}
    </div>`;
  refreshIcons();
}

async function markNotificationRead(id) {
  const n = state.notifications.find(x => x.id === id);
  if (n && !n.is_read) {
    n.is_read = true;
    renderNotifPanel();
    renderNotifBellBadge();
    try { await api(`/notifications/${id}/read`, 'PUT'); } catch (e) { /* silent */ }
  }
}

async function markAllNotificationsRead() {
  state.notifications.forEach(n => n.is_read = true);
  renderNotifPanel();
  renderNotifBellBadge();
  try { await api('/notifications/read-all', 'PUT'); } catch (e) { /* silent */ }
}

function renderNotifBellBadge() {
  const badge = document.getElementById('notif-badge');
  if (!badge) return;
  const unread = state.notifications.filter(n => !n.is_read).length;
  badge.classList.toggle('hidden', unread === 0);
  badge.textContent = unread > 9 ? '9+' : String(unread);
}

/* ---------------------------- Layout shell ---------------------------- */

function heartbeatSvg(cls) {
  return `<svg class="${cls}" viewBox="0 0 400 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path class="heartbeat-path" d="M0 30 H130 L150 10 L170 50 L190 5 L210 55 L230 30 H400"
      stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function navBar() {
  const authed = !!state.token;
  return `
  <header class="border-b border-border bg-surface/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-5 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="goHome()">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white font-display font-bold">M</div>
        <span class="display text-lg font-semibold tracking-tight">MediCare</span>
      </div>
      <nav class="flex items-center gap-2 sm:gap-3 text-sm">
        <button class="w-9 h-9 rounded-lg border border-border hover:bg-paper transition flex items-center justify-center theme-toggle-icon" onclick="toggleTheme()" title="თემის შეცვლა">
          <span class="sun">${icon('sun', 'w-4 h-4')}</span>
          <span class="moon">${icon('moon', 'w-4 h-4')}</span>
        </button>
        ${authed ? `
          <span class="text-muted hidden md:inline">გამარჯობა, <b class="text-ink">${escapeHtml(state.fullName)}</b> <span class="badge bg-primary/10 text-primary ml-1">${roleLabel(state.role)}</span></span>
          <div class="relative">
            <button class="w-9 h-9 rounded-lg border border-border hover:bg-paper transition flex items-center justify-center relative" onclick="toggleNotifPanel()">
              ${icon('bell', 'w-4 h-4')}
              <span id="notif-badge" class="hidden absolute -top-1.5 -right-1.5 bg-clay text-white text-[10px] leading-none rounded-full min-w-[16px] h-4 flex items-center justify-center px-1">0</span>
            </button>
            <div id="notif-panel" class="hidden absolute right-0 mt-2 w-80 max-w-[90vw] bg-surface border border-border rounded-xl shadow-lg z-50 fade-in"></div>
          </div>
          <button class="px-3 py-1.5 rounded-lg bg-primary text-white hover:bg-primaryDark transition flex items-center gap-1.5" onclick="goDashboard()">${icon('layout-dashboard')}<span class="hidden sm:inline">დაშბორდი</span></button>
          <button class="px-3 py-1.5 rounded-lg border border-border hover:bg-paper transition flex items-center gap-1.5" onclick="logout()">${icon('log-out')}<span class="hidden sm:inline">გასვლა</span></button>
        ` : `
          <button class="px-3 py-1.5 rounded-lg hover:bg-paper transition" onclick="setView('login')">შესვლა</button>
          <button class="px-3 py-1.5 rounded-lg bg-primary text-white hover:bg-primaryDark transition" onclick="setView('register')">რეგისტრაცია</button>
        `}
      </nav>
    </div>
  </header>`;
}

function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('mc_theme', isDark ? 'dark' : 'light');
  refreshChartsTheme();
}

function chartTextColor() {
  return document.documentElement.classList.contains('dark') ? '#C7D6D1' : '#6B7A78';
}
function chartGridColor() {
  return document.documentElement.classList.contains('dark') ? '#2B3833' : '#E4DFD4';
}
function refreshChartsTheme() {
  // მიმდინარე გვერდზე გრაფიკები ხელახლა რენდერდება, რომ ტექსტის/ბადრის ფერი შესაბამებოდეს თემას
  if (state.view === 'admin' && state.adminTab === 'analytics') route();
}

function roleLabel(role) {
  return { patient: 'პაციენტი', doctor: 'ექიმი', admin: 'ადმინი' }[role] || role;
}
function statusLabel(s) {
  return { scheduled: 'დაგეგმილი', completed: 'დასრულებული', cancelled: 'გაუქმებული' }[s] || s;
}
function statusBadgeClass(s) {
  return { scheduled: 'bg-primary/10 text-primary', completed: 'bg-success/10 text-success', cancelled: 'bg-danger/10 text-danger' }[s] || '';
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------------------- Icons & visuals ---------------------------- */

const SPECIALTY_META = {
  'კარდიოლოგი':        { icon: 'heart-pulse',   color: '#C0392B' },
  'დერმატოლოგი':       { icon: 'sparkles',      color: '#B8860B' },
  'ნევროლოგი':         { icon: 'brain',         color: '#6D28D9' },
  'ოჯახის ექიმი':      { icon: 'stethoscope',   color: '#0F766E' },
  'გასტროენტეროლოგი':  { icon: 'pill',          color: '#B45309' },
  'პულმონოლოგი':       { icon: 'wind',          color: '#0E7490' },
  'ორთოპედი':          { icon: 'bone',          color: '#334155' },
  'პედიატრი':          { icon: 'baby',          color: '#DB2777' },
  'ოტორინოლარინგოლოგი': { icon: 'ear',          color: '#0284C7' },
};
function specialtyMeta(name) {
  return SPECIALTY_META[name] || { icon: 'stethoscope', color: '#0F766E' };
}
/* ---------- Self-contained icon set (no external CDN / network calls) ---------- */
const ICONS = {
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 6 2 8 2 8H4s2-2 2-8"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  'layout-dashboard': '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  'log-out': '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',

function icon(name, cls) {
  const path = ICONS[name] || ICONS.info;
  return `<svg class="icon-svg ${cls || ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}

const AVATAR_PALETTE = ['#0F766E', '#D97757', '#6D28D9', '#B45309', '#0E7490', '#C0392B', '#DB2777', '#334155'];
function initialsOf(name) {
  const parts = (name || '?').trim().split(/\s+/);
  const first = parts[0] ? parts[0][0] : '';
  const second = parts.length > 1 ? parts[1][0] : '';
  return (first + second).toUpperCase() || '?';
}
function avatarDataUri(seedId, name, hexColor) {
  const initials = initialsOf(name);
  const color = hexColor || AVATAR_PALETTE[Math.abs(seedId) % AVATAR_PALETTE.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
    <defs><linearGradient id="g${seedId}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="${color}"/><stop offset="100%" stop-color="${color}" stop-opacity="0.75"/>
    </linearGradient></defs>
    <rect width="150" height="150" rx="75" fill="url(#g${seedId})"/>
    <text x="75" y="87" font-family="Inter, sans-serif" font-size="52" font-weight="600" fill="white" text-anchor="middle">${initials}</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function doctorAvatarUrl(doctorId, name, hexColor) {
  return avatarDataUri(doctorId, name, hexColor);
}
function refreshIcons() { /* icons are inline SVG now — no post-processing needed */ }
function emptyState(message, iconName) {
  return `<div class="empty-state bg-surface border border-border rounded-xl p-10 text-center text-muted flex flex-col items-center gap-3">
    <span class="text-muted/50">${icon(iconName || 'inbox', 'w-12 h-12')}</span>
    <p class="text-sm">${escapeHtml(message)}</p>
  </div>`;
}

function shell(innerHtml) {
  document.getElementById('app').innerHTML = navBar() + `<main class="max-w-6xl mx-auto px-5 py-8">${innerHtml}</main>` + footer();
  refreshIcons();
  if (state.token) {
    renderNotifBellBadge();
    loadNotifications().then(() => { renderNotifBellBadge(); renderNotifPanel(); });
  }
}

function footer() {
  return `<footer class="border-t border-border mt-16 py-8 text-center text-xs text-muted">
    MediCare Clinic Appointment System — საბაკალავრო პრაქტიკული პროექტი, ${new Date().getFullYear()}
  </footer>`;
}

function goHome() { state.view = 'home'; route(); }
function goDashboard() {
  if (state.role === 'patient') state.view = 'patient';
  else if (state.role === 'doctor') state.view = 'doctor';
  else if (state.role === 'admin') state.view = 'admin';
  route();
}
function setView(v) { state.view = v; route(); }

/* ------------------------------- Router -------------------------------- */
/* SPA history: every successful route() render pushes a browser history
   entry carrying a snapshot of the nav-relevant state, so the browser's
   Back/Forward buttons move between in-app screens instead of leaving the
   app or forcing a re-login. */

function navSnapshot() {
  return {
    view: state.view,
    patientTab: state.patientTab,
    doctorTab: state.doctorTab,
    adminTab: state.adminTab,
    bookingFlow: state.bookingFlow,
  };
}

window.addEventListener('popstate', (ev) => {
  if (ev.state) {
    Object.assign(state, ev.state);
    route(true);
  } else {
    state.view = 'home';
    route(true);
  }
});

async function route(fromPopState) {
  if (!state.token && ['patient', 'doctor', 'admin'].includes(state.view)) {
    state.view = 'login';
  }
  // ავტორიზებული მომხმარებელი ვერ დაბრუნდება login/register/forgot/reset გვერდებზე —
  // ავტომატურად გადამისამართდება საკუთარ დაშბორდზე (ისევე, როგორც ნამდვილ საიტებზე)
  if (state.token && ['login', 'register', 'forgot', 'reset'].includes(state.view)) {
    if (state.role === 'patient') state.view = 'patient';
    else if (state.role === 'doctor') state.view = 'doctor';
    else if (state.role === 'admin') state.view = 'admin';
    else state.view = 'home';
  }
  try {
    switch (state.view) {
      case 'home': await renderHome(); break;
      case 'login': await renderLogin(); break;
      case 'forgot': await renderForgotPassword(); break;
      case 'reset': await renderResetPassword(); break;
      case 'register': await renderRegister(); break;
      case 'patient': await renderPatient(); break;
      case 'doctor': await renderDoctor(); break;
      case 'admin': await renderAdmin(); break;
      default: await renderHome(); break;
    }
  } catch (e) {
    shell(`<div class="max-w-lg mx-auto text-center py-16">
      <div class="text-danger mb-3">${icon('info', 'w-8 h-8 mx-auto')}</div>
      <p class="text-danger font-medium mb-4">${escapeHtml(e.message)}</p>
      <button class="px-4 py-2 rounded-lg bg-primary text-white text-sm" onclick="goHome()">მთავარ გვერდზე დაბრუნება</button>
    </div>`);
  }
  if (!fromPopState) {
    const snap = navSnapshot();
    if (!window.__mcHistInit) {
      window.__mcHistInit = true;
      history.replaceState(snap, '');
    } else {
      history.pushState(snap, '');
    }
  }
}

let symptomOptionsCache = null;
async function loadSymptomChips(containerId, textareaId) {
  const container = document.getElementById(containerId);

    container.innerHTML = symptomOptionsCache.map(s => `
      <button type="button" class="px-2.5 py-1 rounded-full border border-border text-xs hover:border-primary hover:text-primary hover:bg-primary/5 transition" onclick="addSymptomChip('${textareaId}', '${escapeHtml(s.text)}')">+ ${escapeHtml(s.label)}</button>
    `).join('');
  } catch (e) { /* silent — optional enhancement */ }
}

function addSymptomChip(textareaId, text) {
  const el = document.getElementById(textareaId);
  if (!el) return;
  const current = el.value.trim();
  if (current.toLowerCase().includes(text.toLowerCase())) return;
  el.value = current ? `${current}, ${text}` : text;
  el.focus();
}

function toggleBodyMap(uid) {
  const el = document.getElementById(`bodymap-${uid}`);

  const hidden = el.classList.toggle('hidden');
  if (label) label.textContent = hidden ? 'სხეულის რუკით არჩევა' : 'სხეულის რუკის დამალვა';
}

function bodyMapHover(ev, uid, label) {
  ev.target.classList.add('active');
  const el = document.getElementById(`bodymap-label-${uid}`);
  if (!el) return;
  el.textContent = label;
  el.classList.add('show');
  const svg = ev.target.ownerSVGElement;
  const rect = svg.getBoundingClientRect();
  const parentRect = svg.closest('.relative').getBoundingClientRect();
  const pt = svg.createSVGPoint();
  pt.x = ev.target.cx.baseVal.value; pt.y = ev.target.cy.baseVal.value;
  const screenPt = pt.matrixTransform(ev.target.getScreenCTM());
  el.style.left = (screenPt.x - parentRect.left) + 'px';
  el.style.top = (screenPt.y - parentRect.top) + 'px';
}

function bodyMapOut(uid) {
  document.querySelectorAll('.bodymap-hotspot.active').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(`bodymap-label-${uid}`);
  if (el) el.classList.remove('show');
}

function ratingStars(avg, count) {
  if (avg === null || avg === undefined || !count) {
    return `<span class="text-xs text-muted">ჯერ არ არის შეფასებული</span>`;
  }
  const full = Math.round(avg);
  let stars = '';
  for (let i = 1; i <= 5; i++) {
    stars += `<span style="color:${i <= full ? '#D97757' : '#E4DFD4'}">★</span>`;
  }
  return `<span class="text-sm">${stars}</span> <span class="text-xs text-muted">${avg.toFixed(1)} (${count})</span>`;
}

function urgencyMeta(level) {

async function renderUpcomingHolidays(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  try {
    const year = new Date().getFullYear();
    let holidays = await api(`/holidays?year=${year}`, 'GET', null, false);
    const today = new Date().toISOString().slice(0, 10);
    holidays = holidays.filter(h => h.date >= today).slice(0, 3);
    if (!holidays.length) { container.innerHTML = ''; return; }
    container.innerHTML = `
      <h3 class="font-semibold mb-2 text-sm flex items-center gap-1.5">${icon('calendar-off', 'w-4 h-4 text-muted')}უახლოესი უქმე დღეები</h3>
      <ul class="text-xs text-muted space-y-1">
        ${holidays.map(h => `<li class="flex justify-between"><span>${escapeHtml(h.name)}</span><span>${new Date(h.date).toLocaleDateString('ka-GE', {day:'numeric', month:'short'})}</span></li>`).join('')}
      </ul>
      <p class="text-[10px] text-muted mt-1">ამ დღეებზე ჯავშნის გაკეთება შეუძლებელია.</p>`;
  } catch (e) { container.innerHTML = ''; }
}

        <p class="text-xs text-muted mb-3">დაამატეთ ოჯახის წევრი, რომ მისთვისაც შეძლოთ ვიზიტის დაჯავშნა თქვენი ანგარიშიდან.</p>
        <div class="space-y-2 mb-4">
          ${familyMembers.length ? familyMembers.map(f => `
            <div class="flex items-center justify-between bg-paper rounded-lg px-3 py-2 text-sm">
              <span>${escapeHtml(f.full_name)} ${f.relation ? `<span class="text-muted">(${escapeHtml(f.relation)})</span>` : ''}</span>
              <button class="text-danger text-xs font-medium" onclick="handleDeleteFamilyMember(${f.id})">წაშლა</button>
            </div>`).join('') : `<p class="text-muted text-sm">ოჯახის წევრი ჯერ არ დამატებულა.</p>`}
        </div>
        <form onsubmit="return handleAddFamilyMember(event)" class="grid grid-cols-2 gap-2">
          <input required id="family-name" placeholder="სახელი გვარი" class="col-span-2 border border-border rounded-lg px-3 py-2 text-sm bg-paper"/>
          <input id="family-relation" placeholder="ნათესაობა (მაგ: შვილი)" class="border border-border rounded-lg px-3 py-2 text-sm bg-paper"/>

}

async function handleAddFamilyMember(ev) {
  ev.preventDefault();
  const payload = {
    full_name: document.getElementById('family-name').value,
    relation: document.getElementById('family-relation').value || null,
    date_of_birth: document.getElementById('family-dob').value || null,
  };
  try {
    await api('/family-members', 'POST', payload);
    toast('ოჯახის წევრი დაემატა', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
  return false;
}

async function handleDeleteFamilyMember(id) {
  if (!confirm('წავშალო ეს ჩანაწერი?')) return;
  try {
    await api(`/family-members/${id}`, 'DELETE');
    toast('წაიშალა', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
}

async function handleProfileUpdate(ev) {
  ev.preventDefault();
  const payload = {
    full_name: document.getElementById('profile-name').value,
    phone: document.getElementById('profile-phone').value,
  };
  const currentPw = document.getElementById('profile-current-password').value;
  const newPw = document.getElementById('profile-new-password').value;
  if (newPw) {
    payload.current_password = currentPw;
    payload.new_password = newPw;
  }
  try {
    const updated = await api('/auth/me', 'PUT', payload);
    state.fullName = updated.full_name;
    localStorage.setItem('mc_full_name', updated.full_name);
    toast('პროფილი განახლდა', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
  return false;
}

function tabBtn(id, label, current, stateKey) {
  const active = current === id;
  return `<button class="px-4 py-2 text-sm font-medium border-b-2 ${active ? 'border-primary text-primary' : 'border-transparent text-muted hover:text-ink'}" onclick="state.${stateKey}='${id}'; route();">${label}</button>`;
}

async function selectSpecialty(specialty) {
  state.bookingFlow.specialty = specialty;
  const doctors = await api('/doctors?specialty=' + encodeURIComponent(specialty));
  renderBookingPanelDoctors(doctors);
}

async function runPatientAiCheck() {
  const text = document.getElementById('patient-symptom-input').value.trim();
  if (!text) { toast('გთხოვთ, აღწერეთ სიმპტომები'); return; }
  try {
    const res = await api('/ai/recommend', 'POST', { text });
    state.bookingFlow.specialty = res.specialty;
    document.getElementById('booking-panel').innerHTML = urgencyBanner(res) + `
      <div class="bg-primary/5 border border-primary/30 rounded-xl p-4 mb-4 text-sm">
        AI-მ შემოგთავაზათ სპეციალობა: <b>${escapeHtml(res.specialty)}</b> (სანდოობა ${Math.round(res.confidence*100)}%)<br/>
        <span class="text-muted">${escapeHtml(res.reason)}</span>
        ${alternativesLine(res)}
      </div>` + doctorsListForBooking(res.doctors);
  } catch (e) { toast(e.message, 'error'); }
}

function renderBookingPanelDoctors(doctors) {
  document.getElementById('booking-panel').innerHTML = doctorsListForBooking(doctors);
}

function doctorsListForBooking(doctors) {
  const backBtn = `<button class="mb-3 text-sm text-muted hover:text-primary flex items-center gap-1.5" onclick="goBackToSpecialties()">${icon('arrow-left', 'w-4 h-4')}სხვა სპეციალობის არჩევა</button>`;
  if (!doctors.length) return backBtn + emptyState('ამ სპეციალობაზე ექიმი ვერ მოიძებნა.', 'search-x');
  return backBtn + `<div class="grid sm:grid-cols-2 gap-4">${doctors.map((d, idx) => {
    const meta = specialtyMeta(d.specialty);
    return `
    <div class="bg-surface border border-border rounded-xl p-4 card-hover relative">
      ${idx === 0 && d.avg_rating ? `<span class="absolute -top-2 -right-2 badge bg-clay text-white flex items-center gap-1 shadow">${icon('trophy', 'w-3 h-3')}საუკეთესო არჩევანი</span>` : ''}
      <div class="flex items-center gap-3 mb-2">
        <img src="${doctorAvatarUrl(d.id, d.full_name, meta.color)}" alt="" class="avatar-ring w-11 h-11 rounded-full object-cover" style="--ring-color:${meta.color}" onerror="this.style.display='none'"/>
        <div class="flex-1 min-w-0">
          <div class="font-semibold">${escapeHtml(d.full_name)}</div>
          <div class="text-sm flex items-center gap-1" style="color:${meta.color}">${icon(meta.icon, 'w-3.5 h-3.5')}${escapeHtml(d.specialty)}</div>
        </div>
        ${favoriteStarBtn(d)}
      </div>
      <div class="text-xs text-muted mb-1">${ratingStars(d.avg_rating, d.review_count)}</div>
      <div class="text-xs text-muted mb-3">${d.consultation_fee}₾ · ${d.years_experience} წლიანი გამოცდილება</div>
      <button class="w-full py-1.5 rounded-lg bg-primary text-white text-sm hover:bg-primaryDark flex items-center justify-center gap-1.5" onclick="selectDoctorForBooking(${d.id})">${icon('calendar-clock', 'w-4 h-4')}დროის არჩევა</button>
    </div>`;}).join('')}</div>
  <div id="slot-panel" class="mt-4"></div>`;
}

function goBackToSpecialties() {
  state.bookingFlow = { specialty: null, doctors: [], selectedDoctor: null, day: null, slots: [] };
  document.getElementById('booking-panel').innerHTML = `<div class="bg-surface border border-border rounded-xl p-5 text-muted text-sm">აირჩიეთ სპეციალობა მარცხნივ, ან გამოიყენეთ ძებნა, რომ ნახოთ ხელმისაწვდომი ექიმები.</div>`;
}

async function selectDoctorForBooking(doctorId) {
  state.bookingFlow.selectedDoctor = doctorId;
  const today = new Date().toISOString().slice(0, 10);
  let panel = document.getElementById('slot-panel');
  if (!panel) {
    document.getElementById('booking-panel').insertAdjacentHTML('beforeend', '<div id="slot-panel" class="mt-4"></div>');
    panel = document.getElementById('slot-panel');
  }
  let familyOptions = '';
  try {
    const familyMembers = await api('/family-members');
    if (familyMembers.length) {
      familyOptions = `
        <div class="mt-4">
          <label class="text-sm font-medium">ვისთვის ჯავშნით?</label>
          <select id="booking-for" class="w-full mt-1 border border-border rounded-lg px-3 py-2 bg-paper text-sm">
            <option value="">საკუთარი თავისთვის</option>
            ${familyMembers.map(f => `<option value="${f.id}">${escapeHtml(f.full_name)}${f.relation ? ' (' + escapeHtml(f.relation) + ')' : ''}</option>`).join('')}
          </select>
        </div>`;
    }
  } catch (e) { /* not critical */ }
  panel.innerHTML = `
    <div class="bg-surface border border-border rounded-xl p-5 fade-in">
      <button class="mb-3 text-sm text-muted hover:text-primary flex items-center gap-1.5" onclick="closeSlotPanel()">${icon('arrow-left', 'w-4 h-4')}სხვა ექიმის არჩევა</button>
      <h3 class="font-semibold mb-3">2. აირჩიეთ თარიღი</h3>
      <input type="date" id="booking-date" min="${today}" value="${today}" class="border border-border rounded-lg px-3 py-2 bg-paper text-sm" onchange="loadSlots(${doctorId})"/>
      <div id="slots-list" class="flex flex-wrap gap-2 mt-4"></div>
      ${familyOptions}
      <div class="mt-4">
        <label class="text-sm font-medium">სიმპტომების აღწერა (არასავალდებულო)</label>
        <textarea id="booking-symptoms" rows="2" class="w-full mt-1 border border-border rounded-lg px-3 py-2 text-sm bg-paper"></textarea>
      </div>
    </div>`;
  loadSlots(doctorId);
}

function closeSlotPanel() {
  state.bookingFlow.selectedDoctor = null;
  const panel = document.getElementById('slot-panel');
  if (panel) panel.innerHTML = '';
}

async function loadSlots(doctorId) {
  const day = document.getElementById('booking-date').value;
  state.bookingFlow.day = day;
  const listEl = document.getElementById('slots-list');
  listEl.innerHTML = `<span class="text-sm text-muted">იტვირთება...</span>`;
  try {
    const res = await api(`/doctors/${doctorId}/availability?day=${day}`);
    if (res.holiday_name) {
      listEl.innerHTML = `<span class="text-sm text-danger flex items-center gap-1.5">${icon('calendar-off', 'w-4 h-4')}${escapeHtml(day)} უქმე დღეა (${escapeHtml(res.holiday_name)}) — ექიმები არ იღებენ პაციენტებს, სცადეთ სხვა თარიღი.</span>`;
      return;
    }
    if (!res.available_slots.length) {
      listEl.innerHTML = `<span class="text-sm text-muted">ამ დღეს თავისუფალი დრო არ არის, სცადეთ სხვა თარიღი.</span>`;
      return;
    }
    listEl.innerHTML = res.available_slots.map(s => {
      const time = s.split('T')[1];
      return `<button class="px-3 py-1.5 rounded-lg border border-border text-sm hover:bg-primary hover:text-white hover:border-primary transition" onclick="confirmBooking(${doctorId}, '${s}')">${time}</button>`;
    }).join('');
  } catch (e) { listEl.innerHTML = `<span class="text-sm text-danger">${escapeHtml(e.message)}</span>`; }
}

async function confirmBooking(doctorId, startTime) {
  const symptoms = document.getElementById('booking-symptoms').value;
  const forEl = document.getElementById('booking-for');
  const family_member_id = forEl && forEl.value ? parseInt(forEl.value, 10) : null;
  try {
    await api('/appointments', 'POST', { doctor_id: doctorId, start_time: startTime, symptoms, family_member_id });
    toast('ჯავშანი წარმატებით დაფიქსირდა!', 'success');
    state.patientTab = 'mine';
    route();
  } catch (e) { toast(e.message, 'error'); }
}

function appointmentsTable(appts, viewerRole) {
  if (!appts.length) return emptyState('ჯავშნები ჯერ არ გაქვთ.', 'calendar-x');
  const hasCompleted = appts.some(a => a.status === 'completed');
  const hasUnreviewed = appts.some(a => a.status === 'completed' && !a.review_rating);
  return `
  ${viewerRole === 'patient' && hasCompleted && hasUnreviewed ? `
    <div class="mb-3 text-xs text-muted flex items-center gap-1.5">${icon('star', 'w-3.5 h-3.5 text-clay')}დასრულებულ ვიზიტებზე შეგიძლიათ დატოვოთ შეფასება — ღილაკი ცხრილშია, "მოქმედება" სვეტში.</div>` : ''}
  <div class="bg-surface border border-border rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-paper text-muted text-left">
        <tr>
          <th class="p-3">თარიღი/დრო</th>
          ${viewerRole !== 'patient' ? '<th class="p-3">პაციენტი</th>' : '<th class="p-3">ექიმი</th>'}
          <th class="p-3">სპეციალობა</th>
          <th class="p-3">სტატუსი</th>
          <th class="p-3">მოქმედება</th>
        </tr>
      </thead>
      <tbody>
        ${appts.map(a => `
          <tr class="border-t border-border align-top">
            <td class="p-3">
              ${new Date(a.start_time).toLocaleString('ka-GE', {dateStyle:'medium', timeStyle:'short'})}
              ${a.rescheduled_count ? `<span class="text-[10px] text-muted block">↻ გადატანილია</span>` : ''}
              ${a.urgency_level && a.urgency_level !== 'routine' ? `<span class="text-[10px] font-medium block" style="color:${a.urgency_level === 'emergency' ? '#C0392B' : '#B45309'}">${a.urgency_level === 'emergency' ? '⚠ გადაუდებელი' : '⚠ სასწრაფო'}</span>` : ''}
            </td>
            <td class="p-3">${escapeHtml(viewerRole !== 'patient' ? a.patient_name : a.doctor_name)}${a.family_member_name ? `<span class="text-[10px] text-muted block">ოჯახის წევრი: ${escapeHtml(a.family_member_name)}</span>` : ''}</td>
            <td class="p-3">${escapeHtml(a.specialty || '')}</td>
            <td class="p-3"><span class="badge ${statusBadgeClass(a.status)}">${statusLabel(a.status)}</span></td>
            <td class="p-3 space-x-2">
              ${a.status === 'scheduled' ? `<button class="text-primary text-xs font-medium" onclick="openRescheduleForm(${a.id}, ${a.doctor_id})">გადატანა</button>` : ''}
              ${a.status === 'scheduled' && viewerRole === 'patient' ? `<button class="text-danger text-xs font-medium" onclick="cancelAppointment(${a.id})">გაუქმება</button>` : ''}
              ${a.status === 'scheduled' && viewerRole === 'doctor' ? `<button class="text-primary text-xs font-medium" onclick="openPrescriptionForm(${a.id})">დასრულება+რეცეპტი</button>
                <button class="text-danger text-xs font-medium" onclick="cancelAppointment(${a.id})">გაუქმება</button>` : ''}
              ${a.status === 'completed' ? `<button class="text-primary text-xs font-medium" onclick="downloadPrescription(${a.id})">რეცეპტის PDF</button>` : ''}
              ${a.status === 'completed' && viewerRole === 'patient' && !a.review_rating ? `<button class="text-clay text-xs font-medium" onclick="openReviewForm(${a.id})">⭐ შეფასების დატოვება</button>` : ''}
              ${a.status === 'completed' && viewerRole === 'patient' && a.review_rating ? `<span class="text-xs text-muted">${ratingStars(a.review_rating, 1)}</span>` : ''}
            </td>
          </tr>
          <tr id="rx-row-${a.id}"></tr>
        `).join('')}
      </tbody>
    </table>
  </div>`;
}

function openRescheduleForm(appointmentId, doctorId) {
  const row = document.getElementById(`rx-row-${appointmentId}`);
  const today = new Date().toISOString().slice(0, 10);
  row.innerHTML = `<td colspan="5" class="p-4 bg-paper">
    <div class="flex flex-wrap items-end gap-3">
      <div>
        <label class="text-xs font-medium block mb-1">ახალი თარიღი</label>
        <input type="date" id="resched-date-${appointmentId}" min="${today}" value="${today}" class="border border-border rounded-lg px-3 py-2 text-sm" onchange="loadRescheduleSlots(${appointmentId}, ${doctorId})"/>
      </div>
      <div id="resched-slots-${appointmentId}" class="flex flex-wrap gap-2"></div>
    </div>
  </td>`;
  loadRescheduleSlots(appointmentId, doctorId);
}

async function loadRescheduleSlots(appointmentId, doctorId) {
  const day = document.getElementById(`resched-date-${appointmentId}`).value;
  const el = document.getElementById(`resched-slots-${appointmentId}`);
  el.innerHTML = `<span class="text-sm text-muted">იტვირთება...</span>`;
  try {
    const res = await api(`/doctors/${doctorId}/availability?day=${day}`);
    if (res.holiday_name) { el.innerHTML = `<span class="text-sm text-danger">უქმე დღეა (${escapeHtml(res.holiday_name)})</span>`; return; }
    if (!res.available_slots.length) { el.innerHTML = `<span class="text-sm text-muted">თავისუფალი დრო არ არის.</span>`; return; }
    el.innerHTML = res.available_slots.map(s => `<button class="px-3 py-1.5 rounded-lg border border-border text-sm hover:bg-primary hover:text-white hover:border-primary transition" onclick="submitReschedule(${appointmentId}, '${s}')">${s.split('T')[1]}</button>`).join('');
  } catch (e) { el.innerHTML = `<span class="text-sm text-danger">${escapeHtml(e.message)}</span>`; }
}

async function submitReschedule(appointmentId, newStartTime) {
  try {
    await api(`/appointments/${appointmentId}/reschedule`, 'PUT', { start_time: newStartTime });
    toast('ჯავშანი გადატანილია', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
}

async function cancelAppointment(id) {
  if (!confirm('დარწმუნებული ხართ, რომ გსურთ ჯავშნის გაუქმება?')) return;
  try {
    await api(`/appointments/${id}/status`, 'PUT', { status: 'cancelled' });
    toast('ჯავშანი გაუქმდა', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
}

function openPrescriptionForm(appointmentId) {
  const row = document.getElementById(`rx-row-${appointmentId}`);
  row.innerHTML = `<td colspan="5" class="p-4 bg-paper">
    <div class="grid sm:grid-cols-2 gap-3">
      <input id="rx-diag-${appointmentId}" placeholder="დიაგნოზი" class="border border-border rounded-lg px-3 py-2 text-sm"/>
      <input id="rx-med-${appointmentId}" placeholder="მედიკამენტი" class="border border-border rounded-lg px-3 py-2 text-sm"/>
      <input id="rx-dose-${appointmentId}" placeholder="დოზირება" class="border border-border rounded-lg px-3 py-2 text-sm"/>
      <input id="rx-instr-${appointmentId}" placeholder="ინსტრუქცია" class="border border-border rounded-lg px-3 py-2 text-sm"/>
    </div>
    <button class="mt-3 px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium" onclick="submitPrescription(${appointmentId})">დასრულება და შენახვა</button>
  </td>`;
}

async function submitPrescription(appointmentId) {
  const payload = {
    diagnosis: document.getElementById(`rx-diag-${appointmentId}`).value,
    medication: document.getElementById(`rx-med-${appointmentId}`).value,
    dosage: document.getElementById(`rx-dose-${appointmentId}`).value,
    instructions: document.getElementById(`rx-instr-${appointmentId}`).value,
  };
  if (!payload.medication) { toast('მედიკამენტის ველი სავალდებულოა'); return; }
  try {
    await api(`/appointments/${appointmentId}/prescription`, 'POST', payload);
    toast('ვიზიტი დასრულდა და რეცეპტი შეინახა', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
}

let selectedReviewRating = 5;
function openReviewForm(appointmentId) {
  selectedReviewRating = 5;
  const row = document.getElementById(`rx-row-${appointmentId}`);
  row.innerHTML = `<td colspan="5" class="p-4 bg-paper">
    <div class="star-input flex gap-1 mb-2" id="review-stars-${appointmentId}">
      ${[1,2,3,4,5].map(i => `<span onclick="setReviewRating(${appointmentId},${i})" style="color:${i<=5?'#D97757':'#E4DFD4'}">★</span>`).join('')}
    </div>
    <textarea id="review-comment-${appointmentId}" rows="2" placeholder="თქვენი კომენტარი ექიმის შესახებ (არასავალდებულო)" class="w-full border border-border rounded-lg px-3 py-2 text-sm"></textarea>
    <button class="mt-3 px-4 py-2 rounded-lg bg-clay text-white text-sm font-medium" onclick="submitReview(${appointmentId})">შეფასების გაგზავნა</button>
  </td>`;
}

function setReviewRating(appointmentId, rating) {
  selectedReviewRating = rating;
  const stars = document.getElementById(`review-stars-${appointmentId}`).children;
  for (let i = 0; i < stars.length; i++) {
    stars[i].style.color = (i + 1) <= rating ? '#D97757' : '#E4DFD4';
  }
}

async function submitReview(appointmentId) {
  const comment = document.getElementById(`review-comment-${appointmentId}`).value;
  try {
    await api(`/appointments/${appointmentId}/review`, 'POST', { rating: selectedReviewRating, comment });
    toast('შეფასება დაემატა, გმადლობთ!', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
}

/* ---------------------------- Doctor dashboard ---------------------------- */

function startOfWeek(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // 0=Monday
  date.setDate(date.getDate() - day);
  date.setHours(0, 0, 0, 0);
  return date;
}

function changeCalendarWeek(delta) {
  state.calendarWeekOffset += delta;
  route();
}

function urgencyDotColor(level) {
  return { emergency: '#C0392B', urgent: '#B45309' }[level] || '#0F766E';
}

function doctorCalendarWeek(appts) {
  const base = startOfWeek(new Date());
  base.setDate(base.getDate() + state.calendarWeekOffset * 7);
  const days = [...Array(7)].map((_, i) => {
    const d = new Date(base);
    d.setDate(d.getDate() + i);
    return d;
  });
  const dayNames = ['ორშ', 'სამ', 'ოთხ', 'ხუთ', 'პარ', 'შაბ', 'კვ'];
  const todayStr = new Date().toDateString();

  const byDay = {};
  days.forEach(d => { byDay[d.toDateString()] = []; });
  appts.filter(a => a.status !== 'cancelled').forEach(a => {
    const d = new Date(a.start_time);
    const key = d.toDateString();
    if (byDay[key]) byDay[key].push(a);
  });
  Object.values(byDay).forEach(list => list.sort((a, b) => new Date(a.start_time) - new Date(b.start_time)));

  return `
    <div class="flex items-center justify-between mb-4">
      <button class="px-3 py-1.5 rounded-lg border border-border text-sm hover:bg-paper flex items-center gap-1.5" onclick="changeCalendarWeek(-1)">${icon('arrow-left', 'w-4 h-4')}წინა კვირა</button>
      <span class="text-sm font-medium">${days[0].toLocaleDateString('ka-GE', {day:'numeric', month:'short'})} — ${days[6].toLocaleDateString('ka-GE', {day:'numeric', month:'short'})}</span>
      <button class="px-3 py-1.5 rounded-lg border border-border text-sm hover:bg-paper flex items-center gap-1.5" onclick="changeCalendarWeek(1)">შემდეგი კვირა${icon('chevron-right', 'w-4 h-4')}</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-7 gap-3">
      ${days.map((d, i) => {
        const key = d.toDateString();
        const list = byDay[key];
        const isToday = key === todayStr;
        return `
        <div class="bg-surface border ${isToday ? 'border-primary' : 'border-border'} rounded-xl p-3 min-h-[140px]">
          <div class="text-xs font-medium mb-2 flex items-center justify-between">
            <span class="${isToday ? 'text-primary' : 'text-muted'}">${dayNames[i]} · ${d.getDate()}</span>
            ${list.length ? `<span class="badge bg-primary/10 text-primary">${list.length}</span>` : ''}
          </div>
          <div class="space-y-1.5">
            ${list.length ? list.map(a => `
              <div class="text-[11px] px-2 py-1 rounded-lg border" style="border-color:${urgencyDotColor(a.urgency_level)}44; background:${urgencyDotColor(a.urgency_level)}0D;">
                <div class="font-medium flex items-center gap-1" style="color:${urgencyDotColor(a.urgency_level)}">
                  ${a.urgency_level && a.urgency_level !== 'routine' ? '●' : ''} ${new Date(a.start_time).toLocaleTimeString('ka-GE', {hour:'2-digit', minute:'2-digit'})}
                </div>
                <div class="text-ink/80 truncate">${escapeHtml(a.patient_name || '')}</div>
              </div>
            `).join('') : `<p class="text-[11px] text-muted">—</p>`}
          </div>
        </div>`;
      }).join('')}
    </div>
    <p class="text-xs text-muted mt-3 flex items-center gap-1.5">${icon('info', 'w-3.5 h-3.5')}წითელი/ნარინჯისფერი წერტილი მიანიშნებს AI-ს მიერ გამოვლენილ გადაუდებელ/სასწრაფო შემთხვევაზე (განსაზღვრულია პაციენტის სიმპტომების აღწერით).</p>
  `;
}

async function handleScheduleUpdate(ev) {
  ev.preventDefault();
  const payload = {
    work_start_hour: parseInt(document.getElementById('sched-start').value, 10),
    work_end_hour: parseInt(document.getElementById('sched-end').value, 10),
    slot_minutes: parseInt(document.getElementById('sched-slot').value, 10),
  };
  try {
    await api('/doctor/schedule', 'PUT', payload);
    toast('განრიგი განახლდა', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
  return false;
}

async function handleAddTimeOff(ev) {
  ev.preventDefault();
  const date = document.getElementById('timeoff-date').value;
  const reason = document.getElementById('timeoff-reason').value;
  try {
    await api('/doctor/timeoff', 'POST', { date, reason });
    toast('დასვენების დღე დაემატა', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
  return false;
}

async function handleDeleteTimeOff(id) {
  try {
    await api(`/doctor/timeoff/${id}`, 'DELETE');
    toast('წაიშალა', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
}

    </div>
  `);

  if (specialtyEntries.length) {
    renderChart('chart-specialty', 'pie', {
      labels: specialtyEntries.map(e => e[0]),
      datasets: [{
        data: specialtyEntries.map(e => e[1]),
        backgroundColor: specialtyEntries.map(e => specialtyMeta(e[0]).color),
      }],
    });
  }
  renderChart('chart-days', 'bar', {
    labels: dayEntries.map(e => e[0].slice(5)),
    datasets: [{
      label: 'ჯავშნების რაოდენობა',
      data: dayEntries.map(e => e[1]),
      backgroundColor: '#D97757',
      borderRadius: 6,
    }],
  }, { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } });

  renderChart('chart-revenue', 'bar', {
    labels: revenueEntries.map(e => e[0].slice(5)),
    datasets: [{
      label: 'შემოსავალი (₾)',
      data: revenueEntries.map(e => e[1]),
      backgroundColor: '#0F766E',
      borderRadius: 6,
    }],
  }, { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } });

  if (a.review_sentiment.positive||a.review_sentiment.neutral||a.review_sentiment.negative) {
    renderChart('chart-sentiment', 'bar', {
      labels: ['დადებითი', 'ნეიტრალური', 'უარყოფითი'],
      datasets: [{
        data: [a.review_sentiment.positive||0, a.review_sentiment.neutral||0, a.review_sentiment.negative||0],
        backgroundColor: ['#2F855A', '#B8860B', '#C0392B'],
        borderRadius: 6,
      }],
    }, { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } });
  }
}

function runUserSearch() {
  state.adminUserSearch = document.getElementById('user-search').value.trim();
  state.adminUserRole = document.getElementById('user-role-filter').value;

}

async function toggleUserActive(userId, isActive) {
  const action = isActive ? 'დეაქტივაცია' : 'გააქტიურება';
  if (!confirm(`დარწმუნებული ხართ, რომ გსურთ მომხმარებლის ${action}?`)) return;
  try {
    await api(`/admin/users/${userId}/status`, 'PUT', { is_active: !isActive });
    toast(`მომხმარებელი ${isActive ? 'დეაქტივირდა' : 'გააქტიურდა'}`, 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
}

const chartInstances = {};
function renderChart(canvasId, type, data, extraOptions) {
  if (!window.Chart) return;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
  const textColor = chartTextColor();
  const gridColor = chartGridColor();
  const baseOptions = {
    responsive: true, maintainAspectRatio: false,
    color: textColor,
    plugins: { legend: { labels: { color: textColor } } },
    scales: type === 'pie' ? {} : {
      x: { ticks: { color: textColor }, grid: { color: gridColor } },
      y: { ticks: { color: textColor }, grid: { color: gridColor } },
    },
  };
  const merged = Object.assign({}, baseOptions, extraOptions || {});
  if (extraOptions && extraOptions.plugins) merged.plugins = Object.assign({}, baseOptions.plugins, extraOptions.plugins, {
    legend: Object.assign({}, baseOptions.plugins.legend, extraOptions.plugins.legend),
  });
  if (extraOptions && extraOptions.scales) merged.scales = Object.assign({}, baseOptions.scales, extraOptions.scales);
  chartInstances[canvasId] = new Chart(canvas.getContext('2d'), { type, data, options: merged });
}

function statCard(label, value, kind) {
  const color = kind === 'success' ? '#2F855A' : kind === 'danger' ? '#C0392B' : '#0F766E';
  return `<div class="bg-surface border border-border rounded-xl p-4 relative overflow-hidden card-hover">
    <div class="absolute top-0 left-0 w-full h-1" style="background:${color}"></div>
    <div class="text-2xl font-display font-semibold" style="color:${color}">${value}</div>
    <div class="text-xs text-muted mt-1">${label}</div>
  </div>`;
}

  if (!el.classList.contains('hidden')) { el.classList.add('hidden'); el.innerHTML = ''; return; }

  el.innerHTML = `

      <h3 class="font-semibold mb-4">ახალი ექიმის დამატება</h3>

async function submitNewDoctor(ev) {
  ev.preventDefault();
  const payload = {
    full_name: document.getElementById('new-doc-name').value,
    email: document.getElementById('new-doc-email').value,
    password: document.getElementById('new-doc-password').value,
    phone: document.getElementById('new-doc-phone').value,
    specialty: document.getElementById('new-doc-specialty').value,
    years_experience: parseInt(document.getElementById('new-doc-experience').value || '0', 10),
    consultation_fee: parseFloat(document.getElementById('new-doc-fee').value || '0'),
    bio: document.getElementById('new-doc-bio').value,
  };
  try {
    await api('/admin/doctors', 'POST', payload);
    toast('ექიმი დაემატა', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
  return false;
}

function openEditDoctorForm(doctorId) {
  api(`/doctors?include_inactive=true`).then(doctors => {
    const d = doctors.find(x => x.id === doctorId);
    if (!d) return;
    const row = document.getElementById(`doc-edit-row-${doctorId}`);
    row.innerHTML = `<td colspan="6" class="p-4 bg-paper">
      <div class="grid sm:grid-cols-2 gap-3">
        <input id="edit-doc-name-${doctorId}" value="${escapeHtml(d.full_name)}" placeholder="სახელი" class="border border-border rounded-lg px-3 py-2 text-sm"/>
        <input id="edit-doc-specialty-${doctorId}" value="${escapeHtml(d.specialty)}" placeholder="სპეციალობა" class="border border-border rounded-lg px-3 py-2 text-sm"/>
        <input type="number" id="edit-doc-experience-${doctorId}" value="${d.years_experience}" placeholder="გამოცდილება" class="border border-border rounded-lg px-3 py-2 text-sm"/>
        <input type="number" id="edit-doc-fee-${doctorId}" value="${d.consultation_fee}" placeholder="ფასი" class="border border-border rounded-lg px-3 py-2 text-sm"/>
      </div>
      <button class="mt-3 px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium" onclick="submitEditDoctor(${doctorId})">შენახვა</button>
    </td>`;
  });
}

async function submitEditDoctor(doctorId) {
  const payload = {
    full_name: document.getElementById(`edit-doc-name-${doctorId}`).value,
    specialty: document.getElementById(`edit-doc-specialty-${doctorId}`).value,
    years_experience: parseInt(document.getElementById(`edit-doc-experience-${doctorId}`).value || '0', 10),
    consultation_fee: parseFloat(document.getElementById(`edit-doc-fee-${doctorId}`).value || '0'),
  };
  try {
    await api(`/admin/doctors/${doctorId}`, 'PUT', payload);
    toast('ექიმის მონაცემები განახლდა', 'success');
    route();
  } catch (e) { toast(e.message, 'error'); }
}

async function toggleDoctorActive(doctorId, isActive) {

document.addEventListener('click', (ev) => {
  if (!state.notifPanelOpen) return;
  const panel = document.getElementById('notif-panel');
